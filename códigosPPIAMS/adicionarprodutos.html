<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Adicionar Produto</title>
</head>
<body>
    <form action="Gestão de produtos.html" method="get">

        <b>Nome:</b> <input type="text" name="nome" id="">
        <b>Adicionar Imagem:</b><input type="file" name="imagem" accept="image/*">
        <h4>Descrição:</h4>
        <textarea name="descricao" id="" placeholder="Descreva aqui" rows="4" cols="40"></textarea><br>

        <b>Adicione os ingredientes</b><br>
        <textarea name="ingredientes" id="" rows="4" cols="40" placeholder="Adicione seu sabor"></textarea><br>
        <input type="submit" value="Salvar">
    </form>
</body>
</html>
